name: Rewrite runtime
description: Locked Node installation and optional same-run verified build/browser reuse
inputs:
  prebuilt:
    description: Restore the build produced by this workflow run
    default: "false"
  playwright:
    description: Install Chromium and its system libraries
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: rewrite-app/package-lock.json
    - shell: bash
      working-directory: rewrite-app
      run: npm ci --no-audit --no-fund
    - name: Prefer existing official HTTPS Ubuntu archive
      if: inputs.playwright == 'true'
      shell: bash
      run: |
        node rewrite-app/scripts/ci-apt-mirrors.mjs > "${RUNNER_TEMP}/rewrite-apt-mirrors.txt"
        sudo install -m 644 "${RUNNER_TEMP}/rewrite-apt-mirrors.txt" /etc/apt/apt-mirrors.txt
        cmp --silent "${RUNNER_TEMP}/rewrite-apt-mirrors.txt" /etc/apt/apt-mirrors.txt
    - name: Bound browser dependency mirror waits
      if: inputs.playwright == 'true'
      shell: bash
      run: |
        printf '%s\n' \
          'Acquire::http::Timeout "15";' \
          'Acquire::https::Timeout "15";' \
          'Acquire::Retries "1";' \
          | sudo tee /etc/apt/apt.conf.d/zz-testcenter-ci-network >/dev/null
        apt-config dump | node -e 'const config=require("node:fs").readFileSync(0,"utf8").split(/\r?\n/).map(line=>line.toLowerCase()); for(const line of ["Acquire::http::Timeout \"15\";","Acquire::https::Timeout \"15\";","Acquire::Retries \"1\";"]) if(!config.includes(line.toLowerCase())) throw Error("CI APT network bounds are not effective");'
    - if: inputs.playwright == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-playwright-${{ hashFiles('rewrite-app/package-lock.json') }}
    - if: inputs.playwright == 'true'
      shell: bash
      working-directory: rewrite-app
      run: timeout --signal=TERM --kill-after=15s 5m npx --no-install playwright install --with-deps chromium
    - if: inputs.prebuilt == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        digest-mismatch: error
        name: rewrite-build-${{ github.sha }}
        path: ${{ runner.temp }}/rewrite-build
    - if: inputs.prebuilt == 'true'
      shell: bash
      working-directory: rewrite-app
      env:
        CI_ARTIFACT_DIR: ${{ runner.temp }}/rewrite-build
      run: node scripts/ci-build-artifact.mjs restore
