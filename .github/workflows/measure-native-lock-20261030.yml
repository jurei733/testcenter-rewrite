name: Native changed-lock measurement (no acceptance)
on:
  push:
    branches: [codex/native-lock-measure-20261030]
permissions:
  contents: read
jobs:
  measure:
    name: Actual native changed-lock measurement (${{ matrix.replica }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        replica: [first, second, third, fourth]
    defaults:
      run:
        working-directory: rewrite-app
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
      - name: Prepare owned evidence directory
        run: mkdir -p "$RUNNER_TEMP/native-lock-evidence"
      - name: Exercise actual owned Node permission correction
        run: node scripts/measure-native-lock-node.mjs > "$RUNNER_TEMP/native-lock-evidence/node-mode.json"
      - name: Record the full current policy gate
        id: policy
        continue-on-error: true
        run: |
          set +e
          npm run test:ci-policy > "$RUNNER_TEMP/native-lock-evidence/policy.tap" 2>&1
          policy_exit=$?
          printf '%s\n' "$policy_exit" > "$RUNNER_TEMP/native-lock-evidence/policy.exit"
          exit "$policy_exit"
      - name: Exercise actual Linux archive controls
        run: node --test scripts/ci-browser-system-linux.test.mjs > "$RUNNER_TEMP/native-lock-evidence/native-debian.tap" 2>&1
      - name: Audit the complete current locked graph
        run: npm audit --package-lock-only --include=dev --include=optional --audit-level=high --json > "$RUNNER_TEMP/native-lock-evidence/audit.json"
      - name: Download exact locked Chromium
        run: timeout --signal=TERM --kill-after=15s 5m npx --no-install playwright install chromium
      - name: Authenticate actual native APT and capture complete material
        env:
          CI_BROWSER_SYSTEM_FORMAT: "3"
          CI_BROWSER_SYSTEM_DIR: ${{ runner.temp }}/native-browser-system
        run: timeout --signal=TERM --kill-after=15s 5m node scripts/ci-browser-system.mjs pack
      - name: Compare captured material with the immutable qualified expectations
        run: node scripts/measure-native-lock-verify.mjs > "$RUNNER_TEMP/native-lock-evidence/comparison.json"
      - name: Retain measured evidence, including the policy failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-lock-${{ matrix.replica }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-lock-evidence/
            ${{ runner.temp }}/native-browser-system/manifest.json
            ${{ runner.temp }}/browser-material-*/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve the policy gate as the final result
        if: always()
        run: test -f "$RUNNER_TEMP/native-lock-evidence/policy.exit" && test "$(cat "$RUNNER_TEMP/native-lock-evidence/policy.exit")" = 0
