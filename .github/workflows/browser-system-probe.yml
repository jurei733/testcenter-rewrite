name: Browser system package probe
on:
  push:
    branches: [codex/browser-system-probe-20261023]
permissions:
  contents: read
concurrency:
  group: browser-system-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  packages:
    outputs:
      attempt: ${{ github.run_attempt }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rewrite-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
      - run: npm run test:ci-policy
      - run: node --test scripts/ci-browser-system-linux.test.mjs
      - run: timeout --signal=TERM --kill-after=15s 5m node scripts/ci-browser-system.mjs pack
        env:
          CI_BROWSER_SYSTEM_DIR: ${{ runner.temp }}/browser-system
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-system-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-system/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  offline:
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rewrite-app
    env:
      UI_SMOKE_HEADFUL: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
        with:
          playwright: "true"
          browser-system-attempt: ${{ needs.packages.outputs.attempt }}
      - run: xvfb-run --auto-servernum npm run test:browser-capture:built
