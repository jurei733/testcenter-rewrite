name: Authenticated v3 offline browser material admission
on:
  push:
    branches: [codex/browser-material-v3-20261024]
permissions:
  contents: read
concurrency:
  group: material-v3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  producer:
    name: Actual native material producer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      attempt: ${{ github.run_attempt }}
      image-version: ${{ steps.cohort.outputs.image-version }}
      profile-format: ${{ steps.packages.outputs.profile-format }}
      material-sha256: ${{ steps.packages.outputs.material-sha256 }}
    defaults:
      run:
        working-directory: rewrite-app
        shell: bash
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record actual producer image
        id: cohort
        run: bash scripts/ci-browser-cohort.sh record
      - uses: ./.github/actions/rewrite-runtime
      - run: node --test scripts/ci-browser-system-linux.test.mjs scripts/ci-browser-runtime-material.test.mjs
      - name: Download exact locked Chromium before authenticated APT
        run: timeout --signal=TERM --kill-after=15s 5m npx --no-install playwright install chromium
      - name: Produce actual authenticated v3 package and material snapshot
        id: packages
        env:
          CI_BROWSER_SYSTEM_FORMAT: "3"
          CI_BROWSER_SYSTEM_DIR: ${{ runner.temp }}/browser-system
        run: timeout --signal=TERM --kill-after=15s 5m node scripts/ci-browser-system.mjs pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-system-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-system/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Retain producer's owned public material observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: material-v3-producer-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-material-*/
          if-no-files-found: ignore
          retention-days: 7
  consumer:
    name: Actual offline v3 consumer ${{ matrix.sample }}
    needs: producer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        sample: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: rewrite-app
        shell: bash
    env:
      CI: "true"
      UI_SMOKE_HEADFUL: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Actual production composite with mandatory offline/material verification
        uses: ./.github/actions/rewrite-runtime
        with:
          playwright: "true"
          browser-system-attempt: ${{ needs.producer.outputs.attempt }}
          browser-system-image-version: ${{ needs.producer.outputs.image-version }}
          browser-system-profile-format: ${{ needs.producer.outputs.profile-format }}
          browser-system-material-sha256: ${{ needs.producer.outputs.material-sha256 }}
          browser-material-label: ${{ matrix.sample }}
      - name: Verify real archive inspection and all tamper controls after actual restore
        run: node --test scripts/ci-browser-system-linux.test.mjs scripts/ci-browser-runtime-material.test.mjs
      - name: Exercise actual Source captures after mandatory restoration
        run: xvfb-run --auto-servernum npm run test:browser-capture:built
