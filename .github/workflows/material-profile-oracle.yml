name: Actual native browser material and Source pixel cohorts
on:
  push:
    branches: [codex/browser-material-profile-20261023]
permissions:
  contents: read
concurrency:
  group: material-profile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observed-host:
    name: Observed native image ${{ matrix.sample }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        sample: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: rewrite-app
        shell: bash
    env:
      CI: "true"
      UI_SMOKE_HEADFUL: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
      - name: Validate exact Source fixtures and diagnostic comparison controls
        run: node --test scripts/ci-browser-material-profile.test.mjs
      - name: Native authenticated APT oracle for this actual host
        env:
          CI_BROWSER_SYSTEM_DIR: ${{ runner.temp }}/material-native
        run: timeout --signal=TERM --kill-after=15s 5m node scripts/ci-browser-system.mjs pack
      - name: Install exact locked Chromium
        run: timeout --signal=TERM --kill-after=15s 5m npx --no-install playwright install chromium
      - name: Record actual files and repeated unchanged Original viewports
        env:
          CI_BROWSER_NATIVE_MANIFEST: ${{ runner.temp }}/material-native/manifest.json
          CI_BROWSER_MATERIAL_DIR: ${{ runner.temp }}/material-observed
        run: timeout --signal=TERM --kill-after=15s 3m xvfb-run --auto-servernum node scripts/ci-browser-material-profile.mjs
      - name: Retain actual public profiles and Source pixels, including failed attempts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: material-observed-${{ matrix.sample }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/material-observed/
            ${{ runner.temp }}/material-native/manifest.json
          if-no-files-found: error
          retention-days: 7
