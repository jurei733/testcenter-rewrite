name: Service focus qualification
on:
  push:
    branches: [codex/service-focus-live-mode-20261024]
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        check: [participant-auth, original-results, system-check-reports]
    uses: ./.github/workflows/rewrite-service-focus.yml
    with:
      check: ${{ matrix.check }}
