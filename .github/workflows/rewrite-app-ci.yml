name: rewrite-app-ci

on:
  push:
    paths:
      - ".github/workflows/rewrite-app-ci.yml"
      - "rewrite-app/**"
  pull_request:
    paths:
      - ".github/workflows/rewrite-app-ci.yml"
      - "rewrite-app/**"

permissions:
  contents: read

env:
  CI: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-memory-sqlite:
    name: verify-memory-sqlite (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rewrite-app
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: typecheck
            command: npm run typecheck
            playwright: false
          - check: unit
            command: npm run test:unit
            playwright: false
          - check: compatibility
            command: npm run build && npm run test:compatibility:built
            playwright: false
          - check: integration-memory
            command: npm run test:integration:memory
            playwright: false
          - check: integration-file
            command: npm run test:integration:file
            playwright: false
          - check: integration-sqlite
            command: npm run test:integration:sqlite
            playwright: false
          - check: startup-file
            command: npm run smoke:startup:file
            playwright: false
          - check: shutdown-file
            command: npm run smoke:shutdown:file
            playwright: false
          - check: startup
            command: npm run smoke:startup:sqlite
            playwright: false
          - check: shutdown
            command: npm run smoke:shutdown:sqlite
            playwright: false
          - check: ui-quick
            command: npm run ci:browser:quick
            playwright: true
          - check: ui-review-readiness
            command: npm run smoke:ui:review-readiness
            playwright: true
          - check: ui-monitor-review
            command: npm run smoke:ui:monitor-review
            playwright: true
          - check: ui-monitor-detail-review
            command: npm run smoke:ui:monitor-detail-review
            playwright: true
          - check: ui-run-detail-review
            command: npm run smoke:ui:run-detail-review
            playwright: true
          - check: ui-unit-detail-review
            command: npm run smoke:ui:unit-detail-review
            playwright: true
          - check: ui-participant-detail-review
            command: npm run smoke:ui:participant-detail-review
            playwright: true
          - check: ui-participant-monitor-live
            command: npm run smoke:ui:participant-monitor-live
            playwright: true
          - check: ui-monitor-bulk
            command: npm run smoke:ui:monitor-bulk
            playwright: true
          - check: ui-monitor-auto-next
            command: npm run smoke:ui:monitor-auto-next
            playwright: true
          - check: ui-monitor-finish-all
            command: npm run smoke:ui:monitor-finish-all
            playwright: true
          - check: ui-open-run-sync
            command: npm run smoke:ui:open-run-sync
            playwright: true
          - check: ui-activation-blocking-runtime
            command: npm run smoke:ui:activation-blocking-runtime
            playwright: true
          - check: ui-adaptive-runtime
            command: npm run smoke:ui:adaptive-runtime
            playwright: true
          - check: ui-ops
            command: npm run ci:browser:ops
            playwright: true
          - check: ui-full
            command: npm run smoke:ui
            playwright: true
          - check: local-demo
            command: npm run smoke:local-demo
            playwright: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rewrite-app/package-lock.json
      - run: npm ci
      - if: ${{ matrix.playwright }}
        run: npx playwright install --with-deps chromium
      - name: Run ${{ matrix.check }}
        run: ${{ matrix.command }}

  verify-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rewrite-app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rewrite_app
          POSTGRES_USER: rewrite
          POSTGRES_PASSWORD: rewrite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rewrite -d rewrite_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FIRST_SLICE_POSTGRES_URL: postgresql://rewrite:rewrite@127.0.0.1:5432/rewrite_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rewrite-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run db:migrate:postgres:built
      - run: npm run db:doctor:postgres:built
      - name: Run Postgres runtime preflight
        run: |
          APP_BUILD_SHA="${GITHUB_SHA::12}" \
          APP_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          FIRST_SLICE_STORE=postgres \
          RUNTIME_PREFLIGHT_REQUIRE_BUILD_METADATA=true \
          npm run preflight:runtime:built
      - run: npm run test:integration:postgres:built
      - name: Run protected Postgres startup smoke
        run: |
          APP_BUILD_SHA="${GITHUB_SHA::12}" \
          APP_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          FIRST_SLICE_OPERATOR_AUTH_REQUIRED=true \
          npm run smoke:startup:postgres:built

  verify-postgres-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rewrite-app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rewrite_app
          POSTGRES_USER: rewrite
          POSTGRES_PASSWORD: rewrite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rewrite -d rewrite_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FIRST_SLICE_POSTGRES_URL: postgresql://rewrite:rewrite@127.0.0.1:5432/rewrite_app
      FIRST_SLICE_OPERATOR_AUTH_REQUIRED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rewrite-app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run smoke:ui:postgres:built

  deployability:
    name: Deployability preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rewrite-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rewrite-app/package-lock.json
      - run: npm ci
      - name: Run metadata-required file and SQLite gates
        run: |
          APP_BUILD_SHA="${GITHUB_SHA::12}" \
          APP_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          npm run ci:deployability

  docker-image-runtime-smoke:
    name: Docker image runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rewrite-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and run production image smoke
        run: |
          APP_BUILD_SHA="${GITHUB_SHA::12}" \
          APP_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          DOCKER_IMAGE_TAG="testcenter-rewrite-app:${GITHUB_SHA::12}" \
          npm run smoke:docker:runtime

  docker-compose-release-smoke:
    name: Compose Postgres smoke (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rewrite-app
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: standard
            bootstrap-demo: "false"
            production-boundary: "false"
          - mode: demo
            bootstrap-demo: "true"
            production-boundary: "false"
          - mode: production-secret
            bootstrap-demo: "false"
            production-boundary: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rewrite-app/package-lock.json
      - run: npm ci
      - name: Run compose release smoke
        run: |
          APP_BUILD_SHA="${GITHUB_SHA::12}" \
          APP_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          FIRST_SLICE_BOOTSTRAP_DEMO="${{ matrix.bootstrap-demo }}" \
          SMOKE_COMPOSE_PRODUCTION_BOUNDARY="${{ matrix.production-boundary }}" \
          npm run smoke:compose:postgres
