name: rewrite-app-ci

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rewrite-app-ci.yml"
      - ".github/workflows/rewrite-service-focus.yml"
      - ".github/workflows/rewrite-timer-focus.yml"
      - ".github/actions/**"
      - "rewrite-app/**"
  pull_request:
    paths:
      - ".github/workflows/rewrite-app-ci.yml"
      - ".github/workflows/rewrite-service-focus.yml"
      - ".github/workflows/rewrite-timer-focus.yml"
      - ".github/actions/**"
      - "rewrite-app/**"

  workflow_dispatch:
  merge_group:

permissions:
  contents: read

env:
  CI: "true"
  FIRST_SLICE_XML_SCHEMA_CACHE: ${{ github.workspace }}/rewrite-app/.ci/xml-schemas

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    outputs:
      attempt: ${{ github.run_attempt }}
    name: Shared production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rewrite-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
      - run: npm run build
      - name: Package commit-bound production outputs
        env:
          CI_ARTIFACT_DIR: ${{ runner.temp }}/rewrite-build
        run: node scripts/ci-build-artifact.mjs pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rewrite-build-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rewrite-build/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  browser-system-dependencies:
    outputs:
      attempt: ${{ github.run_attempt }}
      image-version: ${{ steps.cohort.outputs.image-version }}
      profile-format: ${{ steps.packages.outputs.profile-format }}
      material-sha256: ${{ steps.packages.outputs.material-sha256 }}
    name: Authenticated browser system packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rewrite-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record exact browser producer image
        id: cohort
        run: bash scripts/ci-browser-cohort.sh record
      - uses: ./.github/actions/rewrite-runtime
      - name: Qualify native Debian archive inspection without installation
        run: node --test scripts/ci-browser-system-linux.test.mjs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-playwright-${{ hashFiles('rewrite-app/package-lock.json') }}
      - name: Download locked Chromium for native material producer
        run: timeout --signal=TERM --kill-after=15s 5m npx --no-install playwright install chromium
      - name: Capture authenticated packages and native APT result
        id: packages
        env:
          CI_BROWSER_SYSTEM_FORMAT: "3"
          CI_BROWSER_SYSTEM_DIR: ${{ runner.temp }}/browser-system
        run: timeout --signal=TERM --kill-after=15s 5m node scripts/ci-browser-system.mjs pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-system-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-system/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Retain owned runtime material diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-material-${{ github.job }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-material-*/
          if-no-files-found: ignore
          retention-days: 7

  browser-system-qualification:
    name: Offline browser system qualification
    needs: [build, browser-system-dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rewrite-app
    env:
      UI_SMOKE_HEADFUL: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate browser producer metadata before installation
        env:
          CI_BROWSER_SYSTEM_EXPECTED_IMAGE_VERSION: ${{ needs.browser-system-dependencies.outputs.image-version }}
          CI_BROWSER_SYSTEM_FORMAT: ${{ needs.browser-system-dependencies.outputs.profile-format }}
          CI_BROWSER_SYSTEM_EXPECTED_MATERIAL_SHA256: ${{ needs.browser-system-dependencies.outputs.material-sha256 }}
        run: bash scripts/ci-browser-cohort.sh check
      - uses: ./.github/actions/rewrite-runtime
        with:
          prebuilt: "true"
          build-attempt: ${{ needs.build.outputs.attempt }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: browser-system-${{ github.sha }}-${{ needs.browser-system-dependencies.outputs.attempt }}
          path: ${{ runner.temp }}/browser-system/
          digest-mismatch: error
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-playwright-${{ hashFiles('rewrite-app/package-lock.json') }}
      - name: Install locked Chromium without another system-package request
        run: timeout --signal=TERM --kill-after=15s 5m npx --no-install playwright install chromium
      - name: Reproduce native APT inventory without network access
        env:
          CI_BROWSER_SYSTEM_DIR: ${{ runner.temp }}/browser-system
          CI_BROWSER_SYSTEM_PRODUCER_ATTEMPT: ${{ needs.browser-system-dependencies.outputs.attempt }}
          CI_BROWSER_SYSTEM_FORMAT: ${{ needs.browser-system-dependencies.outputs.profile-format }}
          CI_BROWSER_SYSTEM_EXPECTED_IMAGE_VERSION: ${{ needs.browser-system-dependencies.outputs.image-version }}
          CI_BROWSER_SYSTEM_EXPECTED_MATERIAL_SHA256: ${{ needs.browser-system-dependencies.outputs.material-sha256 }}
        run: timeout --signal=TERM --kill-after=15s 5m node scripts/ci-browser-system.mjs restore
      - name: Qualify actual native Chromium rendering and capture
        run: xvfb-run --auto-servernum npm run test:browser-capture:built

      - name: Retain owned runtime material diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-material-${{ github.job }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-material-*/
          if-no-files-found: ignore
          retention-days: 7

  typecheck:
    name: verify-memory-sqlite (typecheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rewrite-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
      - run: npm run test:ci-policy
      - run: npm run typecheck:ci

  original-reference-build:
    outputs:
      attempt: ${{ github.run_attempt }}
    name: Pinned Original browser build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iqb-berlin/testcenter
          ref: eedae41840cbe90e5547c0211da818bdf620f5aa
          path: original-reference
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: original-reference/frontend/package-lock.json
      - run: node rewrite-app/scripts/original-browser-reference.mjs verify-source original-reference
      - run: npm ci --no-audit --no-fund
        working-directory: original-reference/frontend
      - name: Compile the unchanged Original frontend
        working-directory: original-reference/frontend
        run: |
          cp src/environments/environment.dev.ts src/environments/environment.ts
          npm run build -- --configuration production
      - run: node rewrite-app/scripts/original-browser-reference.mjs pack original-reference
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: original-reference-${{ github.sha }}-${{ github.run_attempt }}
          path: original-reference/frontend/dist/testcenter-frontend/browser/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  original-browser-reference:
    name: Original browser reference (${{ matrix.family }})
    needs: [build, original-reference-build, browser-system-dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        family: [entry, dialogs, starter, administration, directory]
    defaults:
      run:
        working-directory: rewrite-app
    env:
      UI_SMOKE_HEADFUL: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
        with:
          prebuilt: "true"
          build-attempt: ${{ needs.build.outputs.attempt }}
          playwright: "true"
          browser-system-attempt: ${{ needs.browser-system-dependencies.outputs.attempt }}
          browser-system-image-version: ${{ needs.browser-system-dependencies.outputs.image-version }}
          browser-system-profile-format: ${{ needs.browser-system-dependencies.outputs.profile-format }}
          browser-system-material-sha256: ${{ needs.browser-system-dependencies.outputs.material-sha256 }}
          browser-material-label: ${{ strategy.job-index }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: original-reference-${{ github.sha }}-${{ needs.original-reference-build.outputs.attempt }}
          path: ${{ runner.temp }}/original-browser
          digest-mismatch: error
      - name: Verify native viewport capture
        if: matrix.family == 'administration' || matrix.family == 'directory' || matrix.family == 'entry' || matrix.family == 'starter'
        run: xvfb-run --auto-servernum npm run test:browser-capture:built
        env:
          UI_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/original-captures
      - run: xvfb-run --auto-servernum node scripts/original-browser-reference.mjs capture ${{ matrix.family }}
        env:
          ORIGINAL_BROWSER_REFERENCE_ROOT: ${{ runner.temp }}/original-browser
          ORIGINAL_BROWSER_CAPTURE_DIR: ${{ runner.temp }}/original-captures
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: original-captures-${{ matrix.family }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/original-captures/
          if-no-files-found: warn
          retention-days: 30

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Audit the complete locked dependency graph without installation
        run: npm audit --package-lock-only --include=dev --include=optional --audit-level=high
        working-directory: rewrite-app

  unit:
    name: verify-memory-sqlite (unit)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rewrite-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
        with:
          prebuilt: "true"
          build-attempt: ${{ needs.build.outputs.attempt }}
      - run: npm run test:unit:built && npm run test:parity:terminal-overlap:built

  quick:
    name: verify-memory-sqlite (ui-quick-${{ matrix.check }})
    needs: [build, browser-system-dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UI_SMOKE_HEADFUL: "true"
    defaults:
      run:
        working-directory: rewrite-app
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: bug-report
            group: entry
            command: npm run smoke:ui:bug-report:built
          - check: original-login
            group: entry
            command: npm run smoke:ui:original-login:built
          - check: original-login-protected
            group: entry
            command: npm run smoke:ui:original-login-protected:built
          - check: original-admin-login
            group: entry
            command: npm run smoke:ui:original-admin-login:built
          - check: proof-of-work
            group: entry
            command: npm run smoke:ui:proof-of-work:built && npm run smoke:ui:original-session:built
          - check: system-check
            group: system-check
            command: npm run smoke:ui:system-check:built
          - check: participant-variant
            group: participant
            command: npm run smoke:ui:participant-variant:built
          - check: ib-player
            group: content
            command: npm run smoke:ui:ib-player:built
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
        with:
          prebuilt: "true"
          build-attempt: ${{ needs.build.outputs.attempt }}
          playwright: "true"
          browser-system-attempt: ${{ needs.browser-system-dependencies.outputs.attempt }}
          browser-system-image-version: ${{ needs.browser-system-dependencies.outputs.image-version }}
          browser-system-profile-format: ${{ needs.browser-system-dependencies.outputs.profile-format }}
          browser-system-material-sha256: ${{ needs.browser-system-dependencies.outputs.material-sha256 }}
          browser-material-label: ${{ strategy.job-index }}
      - name: Run Quick browser gates
        shell: bash
        env:
          UI_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/rewrite-ui-artifacts
          CI_BROWSER_COMMAND: ${{ matrix.command }}
        run: xvfb-run --auto-servernum bash --noprofile --norc -e -o pipefail -c "$CI_BROWSER_COMMAND" 2>&1 | tee "$RUNNER_TEMP/rewrite-ui-quick.log"
      - name: Retain failed Quick browser log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-quick-${{ matrix.check }}-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rewrite-ui-quick.log
            ${{ runner.temp }}/rewrite-ui-artifacts/
          if-no-files-found: warn
          retention-days: 7

  quick-extended:
    name: verify-memory-sqlite (ui-qualification-${{ matrix.check }})
    needs: [build, fast-feedback, browser-system-dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UI_SMOKE_HEADFUL: "true"
    defaults:
      run:
        working-directory: rewrite-app
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          # Longest measured journeys first; retain four slots and every scenario.
          - check: activation-roster-warnings
            group: content
            command: npm run smoke:ui:activation-roster-warnings:built
          - check: json-roster
            group: content
            command: npm run smoke:ui:json-roster:built
          - check: original-exit-completeness
            group: participant
            command: npm run smoke:ui:original-exit-completeness:built
          - check: verona-player
            group: content
            command: npm run smoke:ui:verona-player:built
          - check: original-runtime-error-contract
            group: participant
            command: npm run smoke:ui:original-runtime-error-contract:built
          - check: original-runtime-error
            group: participant
            command: npm run smoke:ui:original-runtime-error:built
          - check: original-paused-exit
            group: participant
            command: npm run smoke:ui:original-paused-exit:built
          - check: participant-entry
            group: participant
            command: npm run smoke:ui:participant-entry:built
          - check: original-player-exit
            group: participant
            command: npm run smoke:ui:original-player-exit:built
          - check: participant-review
            group: participant
            command: npm run smoke:ui:participant-review:built
          - check: content
            group: content
            command: npm run smoke:ui:content:built
          - check: original-player-version-error
            group: participant
            command: npm run smoke:ui:original-player-version-error:built
          - check: original-starter-advisories
            group: participant
            command: npm run smoke:ui:original-starter-advisories:built
          - check: original-header
            group: entry
            command: npm run smoke:ui:original-header:built
          - check: original-starter
            group: participant
            command: npm run smoke:ui:original-starter:built
          - check: original-administration
            group: entry
            command: npm run smoke:ui:original-administration:built
          - check: attachment-custom-text
            group: system-check
            command: npm run smoke:ui:attachment-custom-text:built
          - check: participant-debug
            group: participant
            command: npm run smoke:ui:participant-debug:built
          - check: system-check-saved
            group: system-check
            command: npm run smoke:ui:system-check-saved:built
          - check: offline-shell
            group: entry
            command: npm run smoke:ui:offline-shell:built
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
        with:
          prebuilt: "true"
          build-attempt: ${{ needs.build.outputs.attempt }}
          playwright: "true"
          browser-system-attempt: ${{ needs.browser-system-dependencies.outputs.attempt }}
          browser-system-image-version: ${{ needs.browser-system-dependencies.outputs.image-version }}
          browser-system-profile-format: ${{ needs.browser-system-dependencies.outputs.profile-format }}
          browser-system-material-sha256: ${{ needs.browser-system-dependencies.outputs.material-sha256 }}
          browser-material-label: ${{ strategy.job-index }}
      - name: Run Quick browser gates
        shell: bash
        env:
          UI_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/rewrite-ui-artifacts
          CI_BROWSER_COMMAND: ${{ matrix.command }}
        run: xvfb-run --auto-servernum bash --noprofile --norc -e -o pipefail -c "$CI_BROWSER_COMMAND" 2>&1 | tee "$RUNNER_TEMP/rewrite-ui-quick.log"
      - name: Retain failed Quick browser log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-quick-${{ matrix.check }}-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rewrite-ui-quick.log
            ${{ runner.temp }}/rewrite-ui-artifacts/
          if-no-files-found: warn
          retention-days: 7

  fast-feedback:
    name: Fast feedback
    if: always()
    needs: [build, typecheck, dependencies, unit, quick]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the fast qualification set
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'for (const [name, result] of Object.entries(JSON.parse(process.env.RESULTS))) { if (result.result !== "success") { console.error(name + ": " + result.result); process.exitCode = 1; } }'

  # Isolated long suites consume the production build and technical/security
  # gates, but no result of the independent short browser journeys. Complete
  # acceptance still requires every browser qualification and both matrices.
  verify-long-ui:
    needs: [build, typecheck, dependencies, unit, browser-system-dependencies]
    name: verify-memory-sqlite (${{ matrix.check }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rewrite-app
    strategy:
      fail-fast: false
      matrix:
        include:
          # >=700s in the separate terminal89/89 receipt ci-long-ui-timings.json.
          - check: ui-full
            command: npm run smoke:ui:built
            playwright: true
          - check: ui-activation-blocking-runtime
            command: npm run smoke:ui:activation-blocking-runtime:built && npm run smoke:ui:participant-save-retry:built
            playwright: true
          - check: ui-delete-group-results
            command: npm run smoke:ui:delete-group-results:built
            playwright: true
          - check: ui-monitor-detail-review
            command: npm run smoke:ui:monitor-detail-review:built
            playwright: true
          - check: ui-participant-detail-review
            command: npm run smoke:ui:participant-detail-review:built
            playwright: true
          - check: ui-monitor-review
            command: npm run smoke:ui:monitor-review:built
            playwright: true
          - check: ui-unit-detail-review
            command: npm run smoke:ui:unit-detail-review:built
            playwright: true
          - check: ui-monitor-finish-all
            command: npm run smoke:ui:monitor-finish-all:built
            playwright: true
          - check: ui-monitor-bulk
            command: npm run smoke:ui:monitor-bulk:built
            playwright: true
          - check: ui-ops
            command: npm run smoke:ui:operator-auth:built
            playwright: true
          - check: ui-open-run-sync
            command: npm run smoke:ui:open-run-sync:built
            playwright: true
          - check: ui-run-detail-review
            command: npm run smoke:ui:run-detail-review:built
            playwright: true
          - check: ui-monitor-auto-next
            command: npm run smoke:ui:monitor-auto-next:built
            playwright: true
          - check: ui-review-readiness
            command: npm run smoke:ui:review-readiness:built
            playwright: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
        with:
          prebuilt: "true"
          build-attempt: ${{ needs.build.outputs.attempt }}
          playwright: ${{ matrix.playwright && 'true' || 'false' }}
          browser-system-attempt: ${{ needs.browser-system-dependencies.outputs.attempt }}
          browser-system-image-version: ${{ needs.browser-system-dependencies.outputs.image-version }}
          browser-system-profile-format: ${{ needs.browser-system-dependencies.outputs.profile-format }}
          browser-system-material-sha256: ${{ needs.browser-system-dependencies.outputs.material-sha256 }}
          browser-material-label: ${{ strategy.job-index }}
      - name: Run ${{ matrix.check }}
        env:
          UI_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/rewrite-ui-artifacts
          UI_SMOKE_CONTROLLER_TIMER_ARTIFACT_ROOT: ${{ runner.temp }}/controller-timer-diagnostics
        run: ${{ matrix.command }}
      - name: Retain the exact failing browser document
        if: (failure() || cancelled()) && matrix.playwright
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ui-failure-${{ matrix.check }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rewrite-ui-artifacts/failure.json
            ${{ runner.temp }}/rewrite-ui-artifacts/failure.png
          if-no-files-found: warn
          retention-days: 7
      - name: Retain Original sample transport diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: original-sample-${{ matrix.check }}-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rewrite-ui-artifacts/original-sample/*.json
            ${{ runner.temp }}/rewrite-ui-artifacts/original-sample/*.png
          if-no-files-found: warn
          retention-days: 7

  verify-memory-sqlite:
    needs: [build, fast-feedback, browser-system-dependencies]
    name: verify-memory-sqlite (${{ matrix.check }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rewrite-app
    strategy:
      fail-fast: false
      matrix:
        include:
          # Longest observed jobs first; exact timings in rewrite-app/scripts/fixtures/ci-shard-timings.json.
          - check: ui-controller-timer
            command: npm run reference:ui:original-controller-timer:built && npm run smoke:ui:participant-controller-timer:built
            playwright: true
          - check: ui-participant-console
            command: npm run smoke:ui:participant-console-loading:built && npm run smoke:ui:participant-console-context-compat:built
            playwright: true
          - check: ui-participant-native-routes
            command: npm run smoke:ui:participant-native-route:built && npm run smoke:ui:participant-native-tabs:built
            playwright: true
          - check: integration-file
            command: npm run test:integration:file:built
            playwright: false
          - check: ui-admin-delete
            command: npm run smoke:ui:admin-delete:built
            playwright: true
          - check: ui-attachments
            command: npm run smoke:ui:attachments:built && npm run smoke:ui:attachments-live:built && UI_SMOKE_ATTACHMENT_CAMERA_FACING=front npm run smoke:ui:attachments-live:built
            playwright: true
          - check: ui-original-review
            command: npm run smoke:ui:original-review:built
            playwright: true
          - check: ui-original-workspace-files
            command: npm run smoke:ui:original-workspace-files:built
            playwright: true
          - check: ui-verona-development
            command: npm run smoke:ui:verona-development:built
            playwright: true
          - check: ui-deletion-confirmation
            command: npm run smoke:ui:deletion-confirmation:built
            playwright: true
          - check: ui-admin-workspace-access
            command: npm run smoke:ui:admin-workspace-access:built
            playwright: true
          - check: ui-workspace-delete
            command: npm run smoke:ui:workspace-delete:built
            playwright: true
          - check: ui-workspace-rename
            command: npm run smoke:ui:workspace-rename:built
            playwright: true
          - check: ui-console-debug
            command: npm run smoke:ui:participant-debug:built
            playwright: true
          - check: integration-sqlite
            command: npm run test:integration:sqlite:built
            playwright: false
          - check: integration-memory
            command: npm run test:integration:memory:built
            playwright: false
          - check: ui-participant-monitor-live
            command: npm run smoke:ui:participant-monitor-live:built
            playwright: true
          - check: ui-adaptive-runtime
            command: npm run smoke:ui:adaptive-runtime:built
            playwright: true
          - check: local-demo
            command: npm run smoke:local-demo:built
            playwright: true
          - check: ui-participant-command-completion
            command: npm run smoke:ui:participant-command-completion:built
            playwright: true
          - check: ui-original-xml-schema
            command: npm run smoke:ui:original-xml-schema:built
            playwright: true
          - check: compatibility
            command: npm run test:compatibility:built
            playwright: false
          - check: shutdown-file
            command: npm run smoke:shutdown:file:built
            playwright: false
          - check: shutdown
            command: npm run smoke:shutdown:sqlite:built
            playwright: false
          - check: startup
            command: npm run smoke:startup:sqlite:built
            playwright: false
          - check: startup-file
            command: npm run smoke:startup:file:built
            playwright: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
        with:
          prebuilt: "true"
          build-attempt: ${{ needs.build.outputs.attempt }}
          playwright: ${{ matrix.playwright && 'true' || 'false' }}
          browser-system-attempt: ${{ needs.browser-system-dependencies.outputs.attempt }}
          browser-system-image-version: ${{ needs.browser-system-dependencies.outputs.image-version }}
          browser-system-profile-format: ${{ needs.browser-system-dependencies.outputs.profile-format }}
          browser-system-material-sha256: ${{ needs.browser-system-dependencies.outputs.material-sha256 }}
          browser-material-label: ${{ strategy.job-index }}
      - name: Run ${{ matrix.check }}
        env:
          UI_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/rewrite-ui-artifacts
          UI_SMOKE_CONTROLLER_TIMER_ARTIFACT_ROOT: ${{ runner.temp }}/controller-timer-diagnostics
        run: ${{ matrix.command }}
      - name: Retain the exact failing browser document
        if: (failure() || cancelled()) && matrix.playwright
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ui-failure-${{ matrix.check }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rewrite-ui-artifacts/failure.json
            ${{ runner.temp }}/rewrite-ui-artifacts/failure.png
          if-no-files-found: warn
          retention-days: 7
      - name: Retain failed console loading evidence
        if: (failure() || cancelled()) && matrix.check == 'ui-participant-console'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: participant-console-loading-evidence-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rewrite-ui-artifacts/participant-console-loading/*.json
            ${{ runner.temp }}/rewrite-ui-artifacts/participant-console-loading/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Retain failed console debug evidence
        if: failure() && matrix.check == 'ui-console-debug'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: participant-console-debug-evidence-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rewrite-ui-artifacts/participant-debug/*.json
            ${{ runner.temp }}/rewrite-ui-artifacts/participant-debug/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Retain scoped native tab failure evidence
        if: (failure() || cancelled()) && matrix.check == 'ui-participant-native-routes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: participant-native-tabs-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rewrite-ui-artifacts/participant-native-tabs/public-failure.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain failed controller timer diagnostics
        if: (failure() || cancelled()) && matrix.check == 'ui-controller-timer'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controller-timer-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/controller-timer-diagnostics/**/failure.json
            ${{ runner.temp }}/controller-timer-diagnostics/**/api.log
            ${{ runner.temp }}/controller-timer-diagnostics/**/supervision.json
            ${{ runner.temp }}/controller-timer-diagnostics/**/worker-reference.json
          if-no-files-found: warn
          retention-days: 7

      - name: Retain Original sample transport diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: original-sample-${{ matrix.check }}-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rewrite-ui-artifacts/original-sample/*.json
            ${{ runner.temp }}/rewrite-ui-artifacts/original-sample/*.png
          if-no-files-found: warn
          retention-days: 7

  verify-postgres:
    needs: [build, typecheck, dependencies, unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rewrite-app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rewrite_app
          POSTGRES_USER: rewrite
          POSTGRES_PASSWORD: rewrite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rewrite -d rewrite_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FIRST_SLICE_POSTGRES_URL: postgresql://rewrite:rewrite@127.0.0.1:5432/rewrite_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
        with:
          prebuilt: "true"
          build-attempt: ${{ needs.build.outputs.attempt }}
      - run: npm run db:migrate:postgres:built
      - run: npm run db:doctor:postgres:built
      - name: Run Postgres runtime preflight
        run: |
          APP_BUILD_SHA="${GITHUB_SHA::12}" \
          APP_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          FIRST_SLICE_STORE=postgres \
          RUNTIME_PREFLIGHT_REQUIRE_BUILD_METADATA=true \
          npm run preflight:runtime:built
      - run: npm run test:integration:postgres:built
      - name: Run protected Postgres startup smoke
        run: |
          APP_BUILD_SHA="${GITHUB_SHA::12}" \
          APP_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          FIRST_SLICE_OPERATOR_AUTH_REQUIRED=true \
          npm run smoke:startup:postgres:built

  verify-postgres-ui:
    needs: [build, fast-feedback, browser-system-dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rewrite-app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rewrite_app
          POSTGRES_USER: rewrite
          POSTGRES_PASSWORD: rewrite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rewrite -d rewrite_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FIRST_SLICE_POSTGRES_URL: postgresql://rewrite:rewrite@127.0.0.1:5432/rewrite_app
      FIRST_SLICE_OPERATOR_AUTH_REQUIRED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
        with:
          prebuilt: "true"
          build-attempt: ${{ needs.build.outputs.attempt }}
          playwright: "true"
          browser-system-attempt: ${{ needs.browser-system-dependencies.outputs.attempt }}
          browser-system-image-version: ${{ needs.browser-system-dependencies.outputs.image-version }}
          browser-system-profile-format: ${{ needs.browser-system-dependencies.outputs.profile-format }}
          browser-system-material-sha256: ${{ needs.browser-system-dependencies.outputs.material-sha256 }}
          browser-material-label: ${{ strategy.job-index }}
      - name: Run protected PostgreSQL UI
        shell: bash
        env:
          UI_SMOKE_FAILURE_ARTIFACT_DIR: ${{ runner.temp }}/rewrite-postgres-ui-failure
        run: npm run smoke:ui:postgres:built 2>&1 | tee "$RUNNER_TEMP/rewrite-postgres-ui.log"
      - name: Retain failed PostgreSQL UI diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: postgres-ui-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rewrite-postgres-ui.log
            ${{ runner.temp }}/rewrite-postgres-ui-failure/
          if-no-files-found: warn
          retention-days: 7

  deployability:
    needs: [build, fast-feedback]
    name: Deployability preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rewrite-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
        with:
          prebuilt: "true"
          build-attempt: ${{ needs.build.outputs.attempt }}
      - name: Run metadata-required file and SQLite gates
        run: |
          APP_BUILD_SHA="${GITHUB_SHA::12}" \
          APP_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          npm run ci:deployability:built

  docker-image-runtime-smoke:
    name: Docker image runtime smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rewrite-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build and run production image smoke
        run: |
          APP_BUILD_SHA="${GITHUB_SHA::12}" \
          APP_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          DOCKER_IMAGE_TAG="testcenter-rewrite-app:${GITHUB_SHA::12}" \
          npm run smoke:docker:runtime

  docker-compose-release-smoke:
    needs: [build, fast-feedback]
    name: Compose Postgres smoke (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rewrite-app
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: standard
            bootstrap-demo: "false"
            production-boundary: "false"
          - mode: demo
            bootstrap-demo: "true"
            production-boundary: "false"
          - mode: production-secret
            bootstrap-demo: "false"
            production-boundary: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
        with:
          prebuilt: "true"
          build-attempt: ${{ needs.build.outputs.attempt }}
      - name: Run compose release smoke
        run: |
          APP_BUILD_SHA="${GITHUB_SHA::12}" \
          APP_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          FIRST_SLICE_BOOTSTRAP_DEMO="${{ matrix.bootstrap-demo }}" \
          SMOKE_COMPOSE_PRODUCTION_BOUNDARY="${{ matrix.production-boundary }}" \
          npm run smoke:compose:postgres:built

  acceptance:
    name: CI acceptance
    if: always()
    needs: [build, browser-system-dependencies, browser-system-qualification, original-reference-build, original-browser-reference, typecheck, dependencies, unit, quick, quick-extended, verify-long-ui, verify-memory-sqlite, verify-postgres, verify-postgres-ui, deployability, docker-image-runtime-smoke, docker-compose-release-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every qualification group
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const results = JSON.parse(process.env.RESULTS); for (const [name, result] of Object.entries(results)) { if (result.result !== "success") { console.error(name + ": " + result.result); process.exitCode = 1; } }'
