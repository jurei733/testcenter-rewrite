name: rewrite-app-ci

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rewrite-app-ci.yml"
      - ".github/actions/**"
      - "rewrite-app/**"
  pull_request:
    paths:
      - ".github/workflows/rewrite-app-ci.yml"
      - ".github/actions/**"
      - "rewrite-app/**"

  workflow_dispatch:
  merge_group:

permissions:
  contents: read

env:
  CI: "true"
  FIRST_SLICE_XML_SCHEMA_CACHE: ${{ github.workspace }}/rewrite-app/.ci/xml-schemas

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Shared production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rewrite-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
      - run: npm run build
      - name: Package commit-bound production outputs
        env:
          CI_ARTIFACT_DIR: ${{ runner.temp }}/rewrite-build
        run: node scripts/ci-build-artifact.mjs pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rewrite-build-${{ github.sha }}
          path: ${{ runner.temp }}/rewrite-build/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  typecheck:
    name: verify-memory-sqlite (typecheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rewrite-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
      - run: npm run test:ci-policy
      - run: npm run typecheck:ci

  original-reference-build:
    name: Pinned Original browser build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iqb-berlin/testcenter
          ref: eedae41840cbe90e5547c0211da818bdf620f5aa
          path: original-reference
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: original-reference/frontend/package-lock.json
      - run: node rewrite-app/scripts/original-browser-reference.mjs verify-source original-reference
      - run: npm ci --no-audit --no-fund
        working-directory: original-reference/frontend
      - name: Compile the unchanged Original frontend
        working-directory: original-reference/frontend
        run: |
          cp src/environments/environment.dev.ts src/environments/environment.ts
          npm run build -- --configuration production
      - run: node rewrite-app/scripts/original-browser-reference.mjs pack original-reference
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: original-reference-${{ github.sha }}
          path: original-reference/frontend/dist/testcenter-frontend/browser/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  original-browser-reference:
    name: Original browser reference (${{ matrix.family }})
    needs: [build, original-reference-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        family: [entry, dialogs, starter, administration, directory]
    defaults:
      run:
        working-directory: rewrite-app
    env:
      UI_SMOKE_HEADFUL: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
        with:
          prebuilt: "true"
          playwright: "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: original-reference-${{ github.sha }}
          path: ${{ runner.temp }}/original-browser
          digest-mismatch: error
      - name: Verify native viewport capture
        if: matrix.family == 'administration' || matrix.family == 'directory'
        run: xvfb-run --auto-servernum npm run test:browser-capture:built
        env:
          UI_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/original-captures
      - run: xvfb-run --auto-servernum node scripts/original-browser-reference.mjs capture ${{ matrix.family }}
        env:
          ORIGINAL_BROWSER_REFERENCE_ROOT: ${{ runner.temp }}/original-browser
          ORIGINAL_BROWSER_CAPTURE_DIR: ${{ runner.temp }}/original-captures
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: original-captures-${{ matrix.family }}
          path: ${{ runner.temp }}/original-captures/
          if-no-files-found: warn
          retention-days: 30

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
      - run: npm audit --audit-level=high
        working-directory: rewrite-app

  unit:
    name: verify-memory-sqlite (unit)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rewrite-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
        with:
          prebuilt: "true"
      - run: npm run test:unit:built && npm run test:parity:terminal-overlap:built

  quick:
    name: verify-memory-sqlite (ui-quick-${{ matrix.check }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UI_SMOKE_HEADFUL: "true"
    defaults:
      run:
        working-directory: rewrite-app
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: bug-report
            group: entry
            command: npm run smoke:ui:bug-report:built
          - check: original-login
            group: entry
            command: npm run smoke:ui:original-login:built
          - check: original-login-protected
            group: entry
            command: npm run smoke:ui:original-login-protected:built
          - check: original-admin-login
            group: entry
            command: npm run smoke:ui:original-admin-login:built
          - check: proof-of-work
            group: entry
            command: npm run smoke:ui:proof-of-work:built
          - check: system-check
            group: system-check
            command: npm run smoke:ui:system-check:built
          - check: participant-variant
            group: participant
            command: npm run smoke:ui:participant-variant:built
          - check: ib-player
            group: content
            command: npm run smoke:ui:ib-player:built
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
        with:
          prebuilt: "true"
          playwright: "true"
      - name: Run Quick browser gates
        shell: bash
        env:
          UI_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/rewrite-ui-artifacts
        run: xvfb-run --auto-servernum ${{ matrix.command }} 2>&1 | tee "$RUNNER_TEMP/rewrite-ui-quick.log"
      - name: Retain failed Quick browser log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-quick-${{ matrix.check }}-diagnostics
          path: |
            ${{ runner.temp }}/rewrite-ui-quick.log
            ${{ runner.temp }}/rewrite-ui-artifacts/
          if-no-files-found: warn
          retention-days: 7

  quick-extended:
    name: verify-memory-sqlite (ui-qualification-${{ matrix.check }})
    needs: [build, fast-feedback]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UI_SMOKE_HEADFUL: "true"
    defaults:
      run:
        working-directory: rewrite-app
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          # Longest measured journeys first; retain four slots and every scenario.
          - check: activation-roster-warnings
            group: content
            command: npm run smoke:ui:activation-roster-warnings:built
          - check: json-roster
            group: content
            command: npm run smoke:ui:json-roster:built
          - check: original-exit-completeness
            group: participant
            command: npm run smoke:ui:original-exit-completeness:built
          - check: verona-player
            group: content
            command: npm run smoke:ui:verona-player:built
          - check: original-runtime-error-contract
            group: participant
            command: npm run smoke:ui:original-runtime-error-contract:built
          - check: original-runtime-error
            group: participant
            command: npm run smoke:ui:original-runtime-error:built
          - check: original-paused-exit
            group: participant
            command: npm run smoke:ui:original-paused-exit:built
          - check: participant-entry
            group: participant
            command: npm run smoke:ui:participant-entry:built
          - check: original-player-exit
            group: participant
            command: npm run smoke:ui:original-player-exit:built
          - check: participant-review
            group: participant
            command: npm run smoke:ui:participant-review:built
          - check: content
            group: content
            command: npm run smoke:ui:content:built
          - check: original-player-version-error
            group: participant
            command: npm run smoke:ui:original-player-version-error:built
          - check: original-starter-advisories
            group: participant
            command: npm run smoke:ui:original-starter-advisories:built
          - check: original-header
            group: entry
            command: npm run smoke:ui:original-header:built
          - check: original-starter
            group: participant
            command: npm run smoke:ui:original-starter:built
          - check: original-administration
            group: entry
            command: npm run smoke:ui:original-administration:built
          - check: attachment-custom-text
            group: system-check
            command: npm run smoke:ui:attachment-custom-text:built
          - check: participant-debug
            group: participant
            command: npm run smoke:ui:participant-debug:built
          - check: system-check-saved
            group: system-check
            command: npm run smoke:ui:system-check-saved:built
          - check: offline-shell
            group: entry
            command: npm run smoke:ui:offline-shell:built
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
        with:
          prebuilt: "true"
          playwright: "true"
      - name: Run Quick browser gates
        shell: bash
        env:
          UI_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/rewrite-ui-artifacts
        run: xvfb-run --auto-servernum ${{ matrix.command }} 2>&1 | tee "$RUNNER_TEMP/rewrite-ui-quick.log"
      - name: Retain failed Quick browser log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-quick-${{ matrix.check }}-diagnostics
          path: |
            ${{ runner.temp }}/rewrite-ui-quick.log
            ${{ runner.temp }}/rewrite-ui-artifacts/
          if-no-files-found: warn
          retention-days: 7

  fast-feedback:
    name: Fast feedback
    if: always()
    needs: [build, typecheck, dependencies, unit, quick]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the fast qualification set
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'for (const [name, result] of Object.entries(JSON.parse(process.env.RESULTS))) { if (result.result !== "success") { console.error(name + ": " + result.result); process.exitCode = 1; } }'

  verify-memory-sqlite:
    needs: [build, fast-feedback]
    name: verify-memory-sqlite (${{ matrix.check }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rewrite-app
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: compatibility
            command: npm run test:compatibility:built
            playwright: false
          - check: integration-memory
            command: npm run test:integration:memory:built
            playwright: false
          - check: integration-file
            command: npm run test:integration:file:built
            playwright: false
          - check: integration-sqlite
            command: npm run test:integration:sqlite:built
            playwright: false
          - check: startup-file
            command: npm run smoke:startup:file:built
            playwright: false
          - check: shutdown-file
            command: npm run smoke:shutdown:file:built
            playwright: false
          - check: startup
            command: npm run smoke:startup:sqlite:built
            playwright: false
          - check: shutdown
            command: npm run smoke:shutdown:sqlite:built
            playwright: false
          - check: ui-controller-timer
            command: npm run reference:ui:original-controller-timer:built && npm run smoke:ui:participant-controller-timer:built
            playwright: true
          - check: ui-console-debug
            command: npm run smoke:ui:participant-debug:built
            playwright: true
          - check: ui-participant-console
            command: npm run smoke:ui:participant-console-loading:built && npm run smoke:ui:participant-console-context-compat:built
            playwright: true
          - check: ui-participant-command-completion
            command: npm run smoke:ui:participant-command-completion:built
            playwright: true
          - check: ui-participant-native-routes
            command: npm run smoke:ui:participant-native-route:built && npm run smoke:ui:participant-native-tabs:built
            playwright: true
          - check: ui-review-readiness
            command: npm run smoke:ui:review-readiness:built
            playwright: true
          - check: ui-original-review
            command: npm run smoke:ui:original-review:built
            playwright: true
          - check: ui-monitor-review
            command: npm run smoke:ui:monitor-review:built
            playwright: true
          - check: ui-monitor-detail-review
            command: npm run smoke:ui:monitor-detail-review:built
            playwright: true
          - check: ui-run-detail-review
            command: npm run smoke:ui:run-detail-review:built
            playwright: true
          - check: ui-unit-detail-review
            command: npm run smoke:ui:unit-detail-review:built
            playwright: true
          - check: ui-participant-detail-review
            command: npm run smoke:ui:participant-detail-review:built
            playwright: true
          - check: ui-participant-monitor-live
            command: npm run smoke:ui:participant-monitor-live:built
            playwright: true
          - check: ui-monitor-bulk
            command: npm run smoke:ui:monitor-bulk:built
            playwright: true
          - check: ui-monitor-auto-next
            command: npm run smoke:ui:monitor-auto-next:built
            playwright: true
          - check: ui-monitor-finish-all
            command: npm run smoke:ui:monitor-finish-all:built
            playwright: true
          - check: ui-open-run-sync
            command: npm run smoke:ui:open-run-sync:built
            playwright: true
          - check: ui-activation-blocking-runtime
            command: npm run smoke:ui:activation-blocking-runtime:built && npm run smoke:ui:participant-save-retry:built
            playwright: true
          - check: ui-adaptive-runtime
            command: npm run smoke:ui:adaptive-runtime:built
            playwright: true
          - check: ui-ops
            command: npm run smoke:ui:operator-auth:built
            playwright: true
          - check: ui-full
            command: npm run smoke:ui:built
            playwright: true
          - check: ui-attachments
            command: npm run smoke:ui:attachments:built && npm run smoke:ui:attachments-live:built && UI_SMOKE_ATTACHMENT_CAMERA_FACING=front npm run smoke:ui:attachments-live:built
            playwright: true
          - check: ui-verona-development
            command: npm run smoke:ui:verona-development:built
            playwright: true
          - check: local-demo
            command: npm run smoke:local-demo:built
            playwright: true
          - check: ui-original-xml-schema
            command: npm run smoke:ui:original-xml-schema:built
            playwright: true
          - check: ui-deletion-confirmation
            command: npm run smoke:ui:deletion-confirmation:built
            playwright: true
          - check: ui-delete-group-results
            command: npm run smoke:ui:delete-group-results:built
            playwright: true
          - check: ui-admin-workspace-access
            command: npm run smoke:ui:admin-workspace-access:built
            playwright: true
          - check: ui-admin-delete
            command: npm run smoke:ui:admin-delete:built
            playwright: true
          - check: ui-workspace-rename
            command: npm run smoke:ui:workspace-rename:built
            playwright: true
          - check: ui-workspace-delete
            command: npm run smoke:ui:workspace-delete:built
            playwright: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
        with:
          prebuilt: "true"
          playwright: ${{ matrix.playwright && 'true' || 'false' }}
      - name: Run ${{ matrix.check }}
        env:
          UI_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/rewrite-ui-artifacts
          UI_SMOKE_CONTROLLER_TIMER_ARTIFACT_ROOT: ${{ runner.temp }}/controller-timer-diagnostics
        run: ${{ matrix.command }}
      - name: Retain failed console loading evidence
        if: (failure() || cancelled()) && matrix.check == 'ui-participant-console'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: participant-console-loading-evidence
          path: |
            ${{ runner.temp }}/rewrite-ui-artifacts/participant-console-loading/*.json
            ${{ runner.temp }}/rewrite-ui-artifacts/participant-console-loading/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Retain failed console debug evidence
        if: failure() && matrix.check == 'ui-console-debug'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: participant-console-debug-evidence
          path: |
            ${{ runner.temp }}/rewrite-ui-artifacts/participant-debug/*.json
            ${{ runner.temp }}/rewrite-ui-artifacts/participant-debug/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Retain scoped native tab failure evidence
        if: (failure() || cancelled()) && matrix.check == 'ui-participant-native-routes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: participant-native-tabs-evidence
          path: ${{ runner.temp }}/rewrite-ui-artifacts/participant-native-tabs/public-failure.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain failed controller timer diagnostics
        if: failure() && matrix.check == 'ui-controller-timer'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controller-timer-diagnostics
          path: |
            ${{ runner.temp }}/controller-timer-diagnostics/**/failure.json
            ${{ runner.temp }}/controller-timer-diagnostics/**/api.log
          if-no-files-found: warn
          retention-days: 7

      - name: Retain Original sample transport diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: original-sample-${{ matrix.check }}-diagnostics
          path: |
            ${{ runner.temp }}/rewrite-ui-artifacts/original-sample/*.json
            ${{ runner.temp }}/rewrite-ui-artifacts/original-sample/*.png
          if-no-files-found: warn
          retention-days: 7

  verify-postgres:
    needs: [build, fast-feedback]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rewrite-app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rewrite_app
          POSTGRES_USER: rewrite
          POSTGRES_PASSWORD: rewrite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rewrite -d rewrite_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FIRST_SLICE_POSTGRES_URL: postgresql://rewrite:rewrite@127.0.0.1:5432/rewrite_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
        with:
          prebuilt: "true"
      - run: npm run db:migrate:postgres:built
      - run: npm run db:doctor:postgres:built
      - name: Run Postgres runtime preflight
        run: |
          APP_BUILD_SHA="${GITHUB_SHA::12}" \
          APP_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          FIRST_SLICE_STORE=postgres \
          RUNTIME_PREFLIGHT_REQUIRE_BUILD_METADATA=true \
          npm run preflight:runtime:built
      - run: npm run test:integration:postgres:built
      - name: Run protected Postgres startup smoke
        run: |
          APP_BUILD_SHA="${GITHUB_SHA::12}" \
          APP_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          FIRST_SLICE_OPERATOR_AUTH_REQUIRED=true \
          npm run smoke:startup:postgres:built

  verify-postgres-ui:
    needs: [build, fast-feedback]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rewrite-app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rewrite_app
          POSTGRES_USER: rewrite
          POSTGRES_PASSWORD: rewrite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rewrite -d rewrite_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FIRST_SLICE_POSTGRES_URL: postgresql://rewrite:rewrite@127.0.0.1:5432/rewrite_app
      FIRST_SLICE_OPERATOR_AUTH_REQUIRED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
        with:
          prebuilt: "true"
          playwright: "true"
      - run: npm run smoke:ui:postgres:built

  deployability:
    needs: [build, fast-feedback]
    name: Deployability preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rewrite-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
        with:
          prebuilt: "true"
      - name: Run metadata-required file and SQLite gates
        run: |
          APP_BUILD_SHA="${GITHUB_SHA::12}" \
          APP_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          npm run ci:deployability:built

  docker-image-runtime-smoke:
    name: Docker image runtime smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rewrite-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build and run production image smoke
        run: |
          APP_BUILD_SHA="${GITHUB_SHA::12}" \
          APP_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          DOCKER_IMAGE_TAG="testcenter-rewrite-app:${GITHUB_SHA::12}" \
          npm run smoke:docker:runtime

  docker-compose-release-smoke:
    needs: [build, fast-feedback]
    name: Compose Postgres smoke (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rewrite-app
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: standard
            bootstrap-demo: "false"
            production-boundary: "false"
          - mode: demo
            bootstrap-demo: "true"
            production-boundary: "false"
          - mode: production-secret
            bootstrap-demo: "false"
            production-boundary: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
        with:
          prebuilt: "true"
      - name: Run compose release smoke
        run: |
          APP_BUILD_SHA="${GITHUB_SHA::12}" \
          APP_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          FIRST_SLICE_BOOTSTRAP_DEMO="${{ matrix.bootstrap-demo }}" \
          SMOKE_COMPOSE_PRODUCTION_BOUNDARY="${{ matrix.production-boundary }}" \
          npm run smoke:compose:postgres:built

  acceptance:
    name: CI acceptance
    if: always()
    needs: [build, original-reference-build, original-browser-reference, typecheck, dependencies, unit, quick, quick-extended, verify-memory-sqlite, verify-postgres, verify-postgres-ui, deployability, docker-image-runtime-smoke, docker-compose-release-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every qualification group
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const results = JSON.parse(process.env.RESULTS); for (const [name, result] of Object.entries(results)) { if (result.result !== "success") { console.error(name + ": " + result.result); process.exitCode = 1; } }'
