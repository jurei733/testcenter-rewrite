name: rewrite-app-ci

on:
  push:
    paths:
      - ".github/workflows/rewrite-app-ci.yml"
      - "rewrite-app/**"
  pull_request:
    paths:
      - ".github/workflows/rewrite-app-ci.yml"
      - "rewrite-app/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-memory-sqlite:
    name: verify-memory-sqlite (${{ matrix.check }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rewrite-app
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: typecheck
            command: npm run typecheck
            playwright: false
          - check: unit
            command: npm run test:unit
            playwright: false
          - check: integration-memory
            command: npm run test:integration:memory
            playwright: false
          - check: integration-sqlite
            command: npm run test:integration:sqlite
            playwright: false
          - check: startup
            command: npm run smoke:startup:sqlite
            playwright: false
          - check: shutdown
            command: npm run smoke:shutdown:sqlite
            playwright: false
          - check: ui-content
            command: npm run smoke:ui:content
            playwright: true
          - check: ui-full
            command: npm run smoke:ui
            playwright: true
          - check: ui-operator-auth
            command: npm run smoke:ui:operator-auth
            playwright: true
          - check: local-demo
            command: npm run smoke:local-demo
            playwright: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rewrite-app/package-lock.json
      - run: npm ci
      - if: ${{ matrix.playwright }}
        run: npx playwright install --with-deps chromium
      - name: Run ${{ matrix.check }}
        run: ${{ matrix.command }}

  verify-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rewrite-app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rewrite_app
          POSTGRES_USER: rewrite
          POSTGRES_PASSWORD: rewrite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rewrite -d rewrite_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FIRST_SLICE_POSTGRES_URL: postgresql://rewrite:rewrite@127.0.0.1:5432/rewrite_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rewrite-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run db:migrate:postgres:built
      - run: npm run db:doctor:postgres:built
      - run: npm run test:integration:postgres:built
      - run: npm run smoke:startup:postgres:built

  docker-compose-release-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rewrite-app
    env:
      APP_BUILD_SHA: ${{ github.sha }}
      APP_BUILD_TIMESTAMP: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node ./scripts/smoke-compose-postgres.mjs
