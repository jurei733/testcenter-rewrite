name: Participant console owned route qualification

on:
  push:
    branches: [codex/participant-console-regression-linux-20261026]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-participant-console-routes
  cancel-in-progress: true

jobs:
  participant-console:
    name: Complete console cell with actual held-route controls (not complete acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rewrite-app
    env:
      CI: "true"
      UI_SMOKE_HEADFUL: "true"
      FIRST_SLICE_XML_SCHEMA_CACHE: ${{ github.workspace }}/rewrite-app/.ci/xml-schemas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record exact native browser image
        run: bash scripts/ci-browser-cohort.sh record
      - uses: ./.github/actions/rewrite-runtime
      - name: Audit the complete locked Rewrite graph
        run: npm audit --package-lock-only --include=dev --include=optional --audit-level=high
      - name: Verify complete CI inventory and failure propagation
        run: npm run test:ci-policy
      - name: Qualify bounded deadline and response failure handling
        run: node --test scripts/bounded-smoke-cases.test.mjs scripts/smoke-route-failure-gate.test.mjs scripts/drain-smoke-response.test.mjs scripts/smoke-deadline.test.mjs scripts/inactive-runtime-snapshot-gate.test.mjs
      - name: Verify native Debian archive inspection
        run: node --test scripts/ci-browser-system-linux.test.mjs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-playwright-${{ hashFiles('rewrite-app/package-lock.json') }}
      - name: Download locked Chromium
        run: timeout --signal=TERM --kill-after=15s 5m npx --no-install playwright install chromium
      - name: Install authenticated native packages and verify browser material
        env:
          CI_BROWSER_SYSTEM_FORMAT: "3"
          CI_BROWSER_SYSTEM_DIR: ${{ runner.temp }}/browser-system
        run: timeout --signal=TERM --kill-after=15s 5m node scripts/ci-browser-system.mjs pack
      - name: Build fresh production and preserve both complete console entries
        run: xvfb-run --auto-servernum npm run ci:focus -- ui-participant-console
        env:
          UI_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/console-route-qualification
      - name: Retain bounded console evidence without its private store
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: participant-console-routes-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/console-route-qualification/participant-console-loading/*.json
            ${{ runner.temp }}/console-route-qualification/participant-console-loading/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain owned native material diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-material-participant-console-routes-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-material-*/
          if-no-files-found: ignore
          retention-days: 7
