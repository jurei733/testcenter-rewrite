name: Native browser cohort diagnostic (not acceptance)
on:
  push:
    branches: [codex/native-cohort-diagnostic-20261027]
permissions:
  contents: read
jobs:
  native:
    name: Independent authenticated native oracle (${{ matrix.replica }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        replica: [first, second]
    defaults:
      run:
        working-directory: rewrite-app
    env:
      CI: "true"
      CI_BROWSER_SYSTEM_FORMAT: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rewrite-runtime
      - name: Audit the complete locked candidate graph
        run: npm audit --package-lock-only --include=dev --include=optional --audit-level=high
      - name: Download the exact locked Chromium
        run: timeout --signal=TERM --kill-after=15s 5m npx --no-install playwright install chromium
      - name: Independently authenticate native APT and measure actual material
        env:
          CI_BROWSER_SYSTEM_DIR: ${{ runner.temp }}/native-browser-system
        run: timeout --signal=TERM --kill-after=15s 5m node scripts/ci-browser-system.mjs pack
      - name: Retain only owned native inventories and public material evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-cohort-${{ matrix.replica }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-browser-system/manifest.json
            ${{ runner.temp }}/browser-material-*/
          if-no-files-found: warn
          retention-days: 7
