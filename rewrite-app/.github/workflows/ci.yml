name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  CI: "true"

jobs:
  typecheck:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Run SQLite runtime preflight
        run: |
          FIRST_SLICE_STORE=sqlite \
          FIRST_SLICE_SQLITE_FILE=./.data/preflight-ci.sqlite \
          npm run db:migrate:sqlite:built
          FIRST_SLICE_STORE=sqlite \
          FIRST_SLICE_SQLITE_FILE=./.data/preflight-ci.sqlite \
          RUNTIME_PREFLIGHT_REQUIRE_BUILD_METADATA=false \
          npm run preflight:runtime:built

  integration:
    name: Integration (${{ matrix.store }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - store: memory
            command: npm run test:integration:memory
          - store: sqlite
            command: npm run test:integration:sqlite
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: ${{ matrix.command }}

  postgres-integration:
    name: Integration (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rewrite_app
          POSTGRES_USER: rewrite
          POSTGRES_PASSWORD: rewrite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rewrite -d rewrite_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FIRST_SLICE_POSTGRES_URL: postgresql://rewrite:rewrite@127.0.0.1:5432/rewrite_app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Postgres migration command
        run: FIRST_SLICE_STORE=postgres npm run db:migrate:built

      - name: Run Postgres storage doctor
        run: FIRST_SLICE_STORE=postgres npm run db:doctor:built

      - name: Run Postgres runtime preflight
        run: |
          APP_BUILD_SHA="${GITHUB_SHA::12}" \
          APP_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          FIRST_SLICE_STORE=postgres \
          RUNTIME_PREFLIGHT_REQUIRE_BUILD_METADATA=true \
          npm run preflight:runtime:built

      - name: Run Postgres startup smoke
        run: |
          APP_BUILD_SHA="${GITHUB_SHA::12}" \
          APP_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          FIRST_SLICE_OPERATOR_AUTH_REQUIRED=true \
          npm run smoke:startup:postgres:built

      - name: Run Postgres integration tests
        run: npm run test:integration:postgres:built

  postgres-ui-smoke:
    name: UI smoke (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rewrite_app
          POSTGRES_USER: rewrite
          POSTGRES_PASSWORD: rewrite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rewrite -d rewrite_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FIRST_SLICE_POSTGRES_URL: postgresql://rewrite:rewrite@127.0.0.1:5432/rewrite_app
      FIRST_SLICE_OPERATOR_AUTH_REQUIRED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run install:browsers

      - name: Build
        run: npm run build

      - name: Run protected Postgres UI smoke
        run: npm run smoke:ui:postgres:built

  sqlite-smoke:
    name: SQLite smoke (${{ matrix.smoke }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - smoke: startup
            command: npm run smoke:startup:sqlite
            playwright: false
          - smoke: shutdown
            command: npm run smoke:shutdown:sqlite
            playwright: false
          - smoke: ui-content
            command: npm run smoke:ui:content
            playwright: true
          - smoke: ui-full
            command: npm run smoke:ui
            playwright: true
          - smoke: ui-operator-auth
            command: npm run smoke:ui:operator-auth
            playwright: true
          - smoke: local-demo
            command: npm run smoke:local-demo
            playwright: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: ${{ matrix.playwright }}
        run: npm run install:browsers

      - name: Run SQLite smoke
        run: ${{ matrix.command }}

  compose-postgres-smoke:
    name: Compose Postgres smoke (demo=${{ matrix.bootstrap-demo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bootstrap-demo: ["false", "true"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run compose release smoke
        run: |
          APP_BUILD_SHA="${GITHUB_SHA::12}" \
          APP_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          FIRST_SLICE_BOOTSTRAP_DEMO="${{ matrix.bootstrap-demo }}" \
          npm run smoke:compose:postgres
