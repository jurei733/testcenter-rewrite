services:
  rewrite-app-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_BUILD_SHA: ${APP_BUILD_SHA:-local-compose}
        APP_BUILD_TIMESTAMP: ${APP_BUILD_TIMESTAMP:-unknown}
    restart: "no"
    command: ["npm", "run", "db:migrate:postgres:built"]
    environment:
      FIRST_SLICE_STORE: postgres
      FIRST_SLICE_POSTGRES_URL: postgresql://${POSTGRES_USER:-rewrite}:${POSTGRES_PASSWORD:-rewrite}@rewrite-app-postgres:5432/${POSTGRES_DB:-rewrite_app}
    depends_on:
      rewrite-app-postgres:
        condition: service_healthy

  rewrite-app-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_BUILD_SHA: ${APP_BUILD_SHA:-local-compose}
        APP_BUILD_TIMESTAMP: ${APP_BUILD_TIMESTAMP:-unknown}
    restart: unless-stopped
    ports:
      - "${REWRITE_APP_PORT:-4310}:4310"
    environment:
      PORT: "4310"
      FIRST_SLICE_STORE: postgres
      FIRST_SLICE_POSTGRES_URL: postgresql://${POSTGRES_USER:-rewrite}:${POSTGRES_PASSWORD:-rewrite}@rewrite-app-postgres:5432/${POSTGRES_DB:-rewrite_app}
      FIRST_SLICE_OPERATOR_AUTH_REQUIRED: ${FIRST_SLICE_OPERATOR_AUTH_REQUIRED:-true}
      FIRST_SLICE_BOOTSTRAP_DEMO: ${FIRST_SLICE_BOOTSTRAP_DEMO:-false}
      FIRST_SLICE_PARTICIPANT_TIME_ZONE: ${FIRST_SLICE_PARTICIPANT_TIME_ZONE:-Europe/Berlin}
      FIRST_SLICE_ADMIN_LOGIN_MAX_FAILURES: ${FIRST_SLICE_ADMIN_LOGIN_MAX_FAILURES:-5}
      FIRST_SLICE_ADMIN_LOGIN_FAILURE_WINDOW_MS: ${FIRST_SLICE_ADMIN_LOGIN_FAILURE_WINDOW_MS:-1800000}
      FIRST_SLICE_ADMIN_PASSWORD_MIN_LENGTH: ${FIRST_SLICE_ADMIN_PASSWORD_MIN_LENGTH:-8}
      FIRST_SLICE_ADMIN_PASSWORD_PATTERN: ${FIRST_SLICE_ADMIN_PASSWORD_PATTERN:-^.*$}
      FIRST_SLICE_PARTICIPANT_LOGIN_MAX_FAILURES: ${FIRST_SLICE_PARTICIPANT_LOGIN_MAX_FAILURES:-5}
      FIRST_SLICE_PARTICIPANT_LOGIN_FAILURE_WINDOW_MS: ${FIRST_SLICE_PARTICIPANT_LOGIN_FAILURE_WINDOW_MS:-1800000}
      BUG_REPORT_GITHUB_REPOSITORY: ${BUG_REPORT_GITHUB_REPOSITORY:-}
      BUG_REPORT_GITHUB_TOKEN: ${BUG_REPORT_GITHUB_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4310/readyz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      rewrite-app-postgres:
        condition: service_healthy
      rewrite-app-migrate:
        condition: service_completed_successfully
      rewrite-app-preflight:
        condition: service_completed_successfully

  rewrite-app-preflight:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_BUILD_SHA: ${APP_BUILD_SHA:-local-compose}
        APP_BUILD_TIMESTAMP: ${APP_BUILD_TIMESTAMP:-unknown}
    restart: "no"
    command: ["npm", "run", "preflight:runtime:built"]
    environment:
      FIRST_SLICE_STORE: postgres
      FIRST_SLICE_POSTGRES_URL: postgresql://${POSTGRES_USER:-rewrite}:${POSTGRES_PASSWORD:-rewrite}@rewrite-app-postgres:5432/${POSTGRES_DB:-rewrite_app}
      RUNTIME_PREFLIGHT_REQUIRE_BUILD_METADATA: ${RUNTIME_PREFLIGHT_REQUIRE_BUILD_METADATA:-true}
    depends_on:
      rewrite-app-postgres:
        condition: service_healthy
      rewrite-app-migrate:
        condition: service_completed_successfully

  rewrite-app-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rewrite_app}
      POSTGRES_USER: ${POSTGRES_USER:-rewrite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rewrite}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rewrite-app-postgres-data:/var/lib/postgresql/data

volumes:
  rewrite-app-postgres-data:
