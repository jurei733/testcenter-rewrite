services:
  postgres:
    image: postgres:16-alpine
    container_name: testcenter-rewrite-spike-postgres
    environment:
      POSTGRES_DB: testcenter_rewrite_spike
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testcenter_rewrite_spike"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rewrite_spike_postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    container_name: testcenter-rewrite-spike-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rewrite_spike_minio_data:/data

volumes:
  rewrite_spike_postgres_data:
  rewrite_spike_minio_data:
